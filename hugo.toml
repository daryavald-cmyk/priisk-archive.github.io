baseURL = "https://priisk-archive.github.io/"
title = "Пріискъ"
theme = "PaperMod"
defaultContentLanguage = "ru"

[params]
  mainSections = ["posts"]
  disableSpecial1stPost = true
  dateFormat = "2 января 2006 г."
  email = "apriisk@yandex.ru"

[params.assets]
  disableFingerprinting = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menu.main]]
  name = "ПОИСК"
  url = "/search/"
  weight = 9

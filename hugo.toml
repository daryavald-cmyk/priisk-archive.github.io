baseURL = "https://priisk-archive.github.io/"
title = "Пріискъ"
theme = "PaperMod"
defaultContentLanguage = "ru"

[params]
  homeInfoParams = false
  mainSections = ["posts"]
  disableSpecial1stPost = true
  dateFormat = "2 января 2006 г."

[params.assets]
  disableFingerprinting = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

# Меню с иконкой лупы вместо слова
[[menu.main]]
  name = '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-search"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>'
  url = "/search/"
  weight = 10

# Разрешаем HTML-код в статьях (для наших блоков)
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Настройки поиска
[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  location = 0
  distance = 1000
  threshold = 0.4
  minMatchCharLength = 0
  keys = ["title", "permalink", "summary", "content"]

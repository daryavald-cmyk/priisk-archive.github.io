baseURL = "https://priisk-archive.github.io/"
title = "Пріискъ"
theme = "PaperMod"
defaultContentLanguage = "ru"

[params]
  mainSections = ["posts"]
  disableSpecial1stPost = true
  dateFormat = "2 января 2006 г."
  [params.footer]
  disableScrollToTop = true

[params.assets]
  disableFingerprinting = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menu.main]]
  name = "ПОИСК"
  url = "/search/"
  weight = 10
  
[[menu.main]]
  identifier = "tags"
  name = "УКАЗАТЕЛИ"
  url = "/tags/"
  weight = 20
  

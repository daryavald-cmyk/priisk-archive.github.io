baseURL = "https://priisk-archive.github.io/"
title = "Пріискъ"
theme = "PaperMod"
defaultContentLanguage = "ru"

[params]
  homeInfoParams = false
  mainSections = ["posts"]
  disableSpecial1stPost = true
  dateFormat = "2 января 2006 г."
  [markup.goldmark.renderer]
  unsafe = true

[params.assets]
  disableFingerprinting = true
[outputs]
  home = ["HTML", "RSS", "JSON"]
[[menu.main]]
  name = "ПОИСК"
  url = "/search/"
  weight = 10

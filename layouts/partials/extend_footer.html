<footer class="footer">
    <div class="footer-inner">
        
        <!-- Строка 1: Email и адрес -->
        <div class="footer-row">
            <span>E-mail: </span>
            <span class="footer-email">apriisk@yandex.ru</span>
        </div>

        <!-- Строка 2: Копирайт и подпись -->
        <div class="footer-row">
            <span>&copy; {{ now.Year }} {{ site.Title }} </span>
        </div>

    </div>
</footer>

<script>
window.addEventListener('load', function() {
    // 1. Создаем кнопку "Наверх"
    const scrollTopBtn = document.createElement('button');
    scrollTopBtn.id = 'scroll-top';
    scrollTopBtn.innerHTML = '↑'; 
    document.body.appendChild(scrollTopBtn);

    // 2. Логика появления при скролле
    window.addEventListener('scroll', () => {
        if (window.scrollY > 300) {
            scrollTopBtn.classList.add('show');
        } else {
            scrollTopBtn.classList.remove('show');
        }
    });

    // 3. Плавный скролл наверх при клике
    scrollTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // 4. (Опционально) Удаляем старую кнопку темы, если она мешает
    setTimeout(() => {
        const oldBtns = document.querySelectorAll('a[href="#top"], #top-link, .top-link');
        oldBtns.forEach(btn => btn.remove());
    }, 500);
});
</script>

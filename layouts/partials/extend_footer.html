<script>
// Ждем полной загрузки, а затем ждем еще чуть-чуть (на случай, если кнопка появляется с задержкой)
window.addEventListener('load', function() {
    setTimeout(function() {
        // Ищем кнопку по всем возможным признакам
        const killButton = () => {
            const btns = document.querySelectorAll('a[href="#top"], #top-link, .top-link, [id*="scroll"], [class*="scroll"]');
            btns.forEach(btn => btn.remove()); // Физически удаляем из DOM
        };
        
        killButton();
        
        // На всякий случай запускаем еще раз через секунду (если скрипт темы создаст её заново)
        <script>
  const scrollTopBtn = document.createElement('button');
  scrollTopBtn.id = 'scroll-top';
  scrollTopBtn.innerHTML = '↑'; // Или SVG стрелочка
  document.body.appendChild(scrollTopBtn);

  window.addEventListener('scroll', () => {
    if (window.scrollY > 300) {
      scrollTopBtn.classList.add('show');
    } else {
      scrollTopBtn.classList.remove('show');
    }
  });

  scrollTopBtn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
</script>
        setTimeout(killButton, 1000);
    }, 500); 
});
</script>
